services:
  postgres:
    # Keep in sync with the Postgres major version on Railway.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sprintstack
      POSTGRES_PASSWORD: sprintstack
      POSTGRES_DB: sprintstack
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sprintstack -d sprintstack']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    # Keep in sync with the Redis major version on Railway. A cache only, so no volume.
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
