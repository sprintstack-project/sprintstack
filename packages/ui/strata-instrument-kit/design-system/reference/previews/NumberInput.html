<!-- @dsCard group="Forms" height=180 subtitle="Mono figures, stepper rack, Shift = ×10, scrub label" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>NumberInput — preview</title></head>
<body>
<div id="root" class="st-root st-pad"></div>
<script>
var S = window.SprintStack, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'st-grid2'},
 h(S.Field,{label:'Story points',scrub:true,htmlFor:'n1'},h(S.NumberInput,{id:'n1',defaultValue:3,min:0,max:21})),
 h(S.Field,{label:'Estimate',scrub:true,htmlFor:'n2'},h(S.NumberInput,{id:'n2',defaultValue:1.5,step:0.5,min:0,unit:'h'})),
 h(S.Field,{label:'Capacity',htmlFor:'n3',error:'Must be 100% or less'},h(S.NumberInput,{id:'n3',defaultValue:120,unit:'%',invalid:true}))));
</script>
</body>
</html>
