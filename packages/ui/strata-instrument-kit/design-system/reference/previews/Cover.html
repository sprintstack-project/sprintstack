<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Strata Instrument — cover</title>
<style>
  html, body { margin: 0; background: var(--canvas); }
  .cv { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--canvas); }
  .cv svg { position: absolute; inset: 0; }
  .accent { fill: var(--accent); } .empty { fill: var(--line-strong); } .info { fill: var(--info); } .review { fill: var(--review); } .dot { fill: var(--ink-muted); }
  .seg { rx: var(--radius-sm); } .tile { rx: var(--radius-md); }
  .txt { position: absolute; left: 40px; bottom: 40px; max-width: 440px; }
  .name { font: 600 72px/0.95 var(--font-sans); letter-spacing: -0.035em; color: var(--ink); margin: 0; }
  .tag { font: 400 13px/18px var(--font-mono); color: var(--ink-muted); margin: 14px 0 0 2px; letter-spacing: .02em; }
</style></head>
<body>
<div class="cv">
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
  <!--
    blocks: accent ×3 + line-strong ×1 at 64×208 (the status meter: three segments lit, one empty), review 104×64, info 56×56 — corners radius-sm / radius-md
    arrangement: the 4-segment meter as four tall slabs hanging from the top edge, satellites to its right, one bleeding off the right edge
    pattern: "precise, technical, mono, a 4px grid → a dot grid at one spacing step": Instrument's boards sit on a 16px dot grid, so a 6×4 patch of grid-pitch dots sits under the satellites
    steps/radii: space-4 (16) gaps and grid-pitch (16) dots, space-8 (32) insets; radius-sm segments, radius-md tiles
  -->
  <rect class="accent seg" x="520" y="-8" width="64" height="208"/>
  <rect class="accent seg" x="600" y="-8" width="64" height="208"/>
  <rect class="accent seg" x="680" y="-8" width="64" height="208"/>
  <rect class="empty seg" x="760" y="-8" width="64" height="208"/>
  <rect class="review tile" x="856" y="32" width="112" height="64"/>
  <rect class="info tile" x="856" y="112" width="56" height="56"/>
  <g>
    <circle class="dot" cx="864" cy="200" r="1.5"/><circle class="dot" cx="880" cy="200" r="1.5"/><circle class="dot" cx="896" cy="200" r="1.5"/><circle class="dot" cx="912" cy="200" r="1.5"/><circle class="dot" cx="928" cy="200" r="1.5"/><circle class="dot" cx="944" cy="200" r="1.5"/>
    <circle class="dot" cx="864" cy="216" r="1.5"/><circle class="dot" cx="880" cy="216" r="1.5"/><circle class="dot" cx="896" cy="216" r="1.5"/><circle class="dot" cx="912" cy="216" r="1.5"/><circle class="dot" cx="928" cy="216" r="1.5"/><circle class="dot" cx="944" cy="216" r="1.5"/>
    <circle class="dot" cx="864" cy="232" r="1.5"/><circle class="dot" cx="880" cy="232" r="1.5"/><circle class="dot" cx="896" cy="232" r="1.5"/><circle class="dot" cx="912" cy="232" r="1.5"/><circle class="dot" cx="928" cy="232" r="1.5"/><circle class="dot" cx="944" cy="232" r="1.5"/>
    <circle class="dot" cx="864" cy="248" r="1.5"/><circle class="dot" cx="880" cy="248" r="1.5"/><circle class="dot" cx="896" cy="248" r="1.5"/><circle class="dot" cx="912" cy="248" r="1.5"/><circle class="dot" cx="928" cy="248" r="1.5"/><circle class="dot" cx="944" cy="248" r="1.5"/>
  </g>
</svg>
<div class="txt">
  <p class="name">Strata<br>Instrument</p>
  <p class="tag">Keyboard-first issue tracking. Dark by default.</p>
</div>
</div>
</body>
</html>
