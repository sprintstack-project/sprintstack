<!-- @dsCard group="Forms" height=290 subtitle="Status with meters; number keys jump to an option" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Select — preview</title></head>
<body>
<div id="root" class="st-root st-pad"></div>
<script>
var S = window.SprintStack, h = React.createElement;
var STATUS=[{value:'todo',label:'To do',status:'neutral'},{value:'progress',label:'In progress',status:'info'},{value:'review',label:'In review',status:'review'},{value:'done',label:'Done',status:'success'},{value:'blocked',label:'Blocked',status:'danger'}];
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'st-grid2'},
 h(S.Field,{label:'Status',htmlFor:'s1'},h(S.Select,{id:'s1',options:STATUS,defaultValue:'progress',defaultOpen:true})),
 h(S.Field,{label:'Sprint',htmlFor:'s2'},h(S.Select,{id:'s2',placeholder:'Choose a sprint',shortcut:'⇧S',options:[{value:'s24',label:'Sprint 24',description:'ACTIVE'},{value:'s25',label:'Sprint 25',description:'04 NOV'},{value:'bl',label:'Backlog'}]}))));
</script>
</body>
</html>
