<!-- @dsCard group="Forms" height=250 subtitle="Search pill with action, default, invalid, disabled" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Input — preview</title></head>
<body>
<div id="root" class="st-root st-pad"></div>
<script>
var S = window.SprintStack, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'st-col'},
 h(S.Input,{pill:true,leadingIcon:'search',placeholder:'E.g. checkout bug',trailing:h(S.Button,{variant:'brand',size:'sm'},'Search')}),
 h('div',{className:'st-grid2'},
  h(S.Field,{label:'Title',htmlFor:'a'},h(S.Input,{id:'a',placeholder:'What needs to be done?'})),
  h(S.Field,{label:'Project key',htmlFor:'d',description:'Set when the project was created'},h(S.Input,{id:'d',defaultValue:'PAY',disabled:true})))));
</script>
</body>
</html>
