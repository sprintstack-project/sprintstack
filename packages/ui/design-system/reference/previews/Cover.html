<!-- @dsCard height=300 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Strata Bold — cover</title>
<style>
  html, body { margin: 0; background: var(--canvas); }
  .cv { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--canvas); }
  .cv svg { position: absolute; inset: 0; }
  .brand { fill: var(--brand); } .ink { fill: var(--ink); } .muted { fill: var(--surface-muted); } .info { fill: var(--info-subtle); } .warn { fill: var(--warning-subtle); } .hair { fill: none; stroke: var(--line-strong); stroke-width: 1.5; }
  .tile { rx: var(--radius-2xl); } .pill { rx: 20px; }
  .txt { position: absolute; left: 40px; bottom: 36px; max-width: 440px; }
  .name { font: 800 112px/0.95 var(--font-display); font-stretch: 75%; letter-spacing: -0.01em; color: var(--ink); margin: 0; }
  .name em { font-style: normal; color: var(--brand-ink); }
  .tag { font: 600 14px/20px var(--font-sans); font-stretch: 87.5%; color: var(--ink-muted); margin: 12px 0 0 2px; }
</style></head>
<body>
<div class="cv">
<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
  <!--
    blocks: brand 256×212 tile, ink 208×132 tile, surface-muted 208×176 tile (bleeds right and bottom) — corners radius-2xl (28)
    arrangement: a staggered stack of tiles hanging from the top edge like the dashboard grid; the grey tile bleeds off the right edge
    pattern: "soft, friendly, large radii → pills": Bold is built from pills, so a row of five filter pills (ink, outline, info, warning tints) runs under the red tile
    steps/radii: space-4 (16) gaps, space-5 (20) between tile and pills; radius-2xl tiles, radius-full pills (rx = half of 40)
  -->
  <rect class="brand tile" x="496" y="-24" width="256" height="212"/>
  <rect class="ink tile" x="768" y="-24" width="208" height="132"/>
  <rect class="muted tile" x="768" y="124" width="208" height="200"/>
  <rect class="ink pill" x="496" y="208" width="104" height="40"/>
  <rect class="hair pill" x="616" y="208.75" width="80" height="38.5"/>
  <rect class="info pill" x="496" y="260" width="72" height="40"/>
  <rect class="warn pill" x="584" y="260" width="112" height="40"/>
  <rect class="brand pill" x="712" y="208" width="40" height="40"/>
</svg>
<div class="txt">
  <p class="name">Strata<br><em>Bold</em></p>
  <p class="tag">Loud headlines, calm work. Issue tracking in red and ink.</p>
</div>
</div>
</body>
</html>
