<!-- @dsCard group="Forms" height=450 subtitle="Menu with icons, hairlines, red check and a destructive row" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Select — preview</title></head>
<body>
<div id="root" class="st-root st-pad"></div>
<script>
var S = window.SprintStack, h = React.createElement;
ReactDOM.createRoot(document.getElementById('root')).render(h('div',{className:'st-grid2'},
 h(S.Field,{label:'Sort by',htmlFor:'s1'},h(S.Select,{id:'s1',defaultValue:'recent',defaultOpen:true,options:[{value:'recent',label:'Most recent',icon:'clock'},{value:'rel',label:'Relevance',icon:'lines'},{value:'prio',label:'Highest priority',icon:'flag'},{value:'due',label:'Due date',icon:'calendar',disabled:true},{value:'clear',label:'Clear this view',icon:'trash',danger:true}]})),
 h(S.Field,{label:'Status',htmlFor:'s2'},h(S.Select,{id:'s2',defaultValue:'review',options:[{value:'todo',status:'neutral'},{value:'progress',status:'info'},{value:'review',status:'review'},{value:'done',status:'success'},{value:'blocked',status:'danger'}]}))));
</script>
</body>
</html>
